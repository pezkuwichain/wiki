name: CI

on:
  pull_request:
    branches: [main]
  # Direct pushes to main were ungated: the only workflow ran on pull requests, so a commit
  # pushed straight here was published by the server without anything having built it.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      # The whitepaper is not kept in this repo. It is fetched from the repository that owns
      # it and rendered here in the wiki's own theme, so the two can never describe different
      # documents -- which is exactly what happened while each site kept its own copy.
      - name: Fetch the whitepaper from pezkuwi-DKS
        run: ./scripts/fetch-whitepaper.sh
      # No `-q`: `--strict` counts warnings, and `-q` lowers the log level until they are
      # never emitted -- so `--strict -q` exits 0 on the same broken link this catches.
      # Measured on mkdocs 1.6.1 while building the server-side publisher.
      - name: Build site (fails on broken links/refs)
        run: mkdocs build --strict
