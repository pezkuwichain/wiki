name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # The whitepaper lives in another repository, so a merge there changes what this site should
  # publish without touching this one. A pull rather than a cross-repo trigger: one fewer secret
  # and one fewer thing that can quietly stop working, at the cost of a few hours' latency.
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: wiki-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to wiki.pezkuwichain.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      # The whitepaper is not kept in this repo. It is fetched from the repository that owns
      # it and rendered here in the wiki's own theme, so the two can never describe different
      # documents -- which is exactly what happened while each site kept its own copy.
      - name: Fetch the whitepaper from pezkuwi-DKS
        run: ./scripts/fetch-whitepaper.sh

      - name: Build site
        run: mkdocs build --strict

      - name: Deploy via rsync
        env:
          SSH_KEY:  ${{ secrets.WIKI_VPS_SSH_KEY }}
          HOST:     ${{ secrets.WIKI_VPS_HOST }}
          PORT:     ${{ secrets.WIKI_VPS_PORT }}
          USER:     ${{ secrets.WIKI_VPS_USER }}
        run: |
          set -euo pipefail

          # This step failed silently from 2026-06-15 to 2026-09-10 and the site was kept
          # current by hand instead. It printed nothing at all: `ssh-keyscan`'s stderr went to
          # /dev/null, and under `set -e` its non-zero exit ended the script with no message.
          # An unset secret, an unreachable host and a rejected key all looked identical --
          # exit 1, five seconds, no output. So each stage now says which one it was.
          for v in SSH_KEY HOST PORT USER; do
            if [ -z "${!v:-}" ]; then
              echo "::error::secret WIKI_VPS_$v is empty or not set for this repository"
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Keep stderr. Whether the host answered at all is the first thing worth knowing,
          # and it is the thing the old `2>/dev/null` threw away.
          if ! ssh-keyscan -T 15 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts; then
            echo "::error::cannot reach the wiki host on its SSH port -- wrong host/port, or a firewall"
            exit 1
          fi

          if ! rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT -o IdentitiesOnly=yes -o ConnectTimeout=20" \
            site/ "$USER@$HOST:/var/www/subdomains/wiki/"; then
            echo "::error::rsync failed after the host answered -- key rejected, or the target path is not writable"
            exit 1
          fi
          echo "Deployed $(date -u) to wiki.pezkuwichain.io"
